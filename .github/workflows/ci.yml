name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check changed-line formatting
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-format.ps1 -Ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install webclient dependencies
        working-directory: server/webclient
        run: bun install --frozen-lockfile

      - name: Type-check, test, and verify generated docs
        run: bun run typecheck && bun run typecheck:webclient && bun run test

  windows-tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell developer tooling
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-powershell.ps1
